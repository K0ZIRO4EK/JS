<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Generator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #111827;
      color: #f9fafb;
      font-family: Arial, sans-serif;
    }

    .container {
      width: min(100%, 460px);
      padding: 32px;
      border: 1px solid #374151;
      border-radius: 18px;
      background: #1f2937;
      box-shadow: 0 12px 30px rgba(0, 0, 0, .25);
    }

    h1 {
      margin-bottom: 10px;
      text-align: center;
      font-size: 30px;
    }

    .subtitle {
      margin-bottom: 28px;
      color: #9ca3af;
      text-align: center;
      line-height: 1.5;
    }

    .password-output {
      display: flex;
      gap: 8px;
      margin-bottom: 26px;
    }

    .password-field {
      min-width: 0;
      flex: 1;
      padding: 14px;
      border: 1px solid #4b5563;
      border-radius: 10px;
      outline: none;
      background: #111827;
      color: #f9fafb;
      font-size: 16px;
      cursor: auto;
    }

    .copy-btn,
    .generate-btn {
      border: none;
      border-radius: 10px;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    .copy-btn {
      padding: 0 15px;
      background: #374151;
      border: 1px solid transparent;
    }

    .copy-btn:hover {
      border-color: #4b5563;
    }

    .copy-btn:active {
      background: #2a323e;
    }

    .copy-btn.blocked {
      opacity: .3;
      pointer-events: none;
    }

    .settings {
      display: flex;
      flex-direction: column;
      gap: 18px;
      margin-bottom: 28px;
    }

    .length-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .length-value {
      color: #a5b4fc;
      font-size: 20px;
      font-weight: 700;
    }

    .length-slider {
      width: 100%;
      accent-color: #818cf8;
      cursor: pointer;
    }

    .options {
      display: grid;
      gap: 14px;
    }

    .option {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #e5e7eb;
      cursor: pointer;
    }

    .option input {
      width: 17px;
      height: 17px;
      accent-color: #818cf8;
      cursor: pointer;
    }

    .generate-btn {
      width: 100%;
      padding: 16px;
      background: #6366f1;
      font-size: 16px;
    }

    .generate-btn:hover {
      background: #7c7de5;
    }

    .generate-btn:active {
      background: #363784;
    }

    .generate-btn.blocked {
      opacity: .3;
      pointer-events: none;
    }

    @media (max-width: 420px) {
      .container {
        padding: 24px 18px;
      }

      h1 {
        font-size: 26px;
      }

      .password-output {
        flex-direction: column;
      }

      .copy-btn {
        padding: 12px;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Password Generator</h1>
    <p class="subtitle">Create a strong password in a couple of seconds</p>

    <div class="password-output">
      <input
        class="password-field"
        id="password"
        type="text"
        placeholder="Your password show here"
        readonly
        aria-label="Generated the password"
      >
      <button class="copy-btn" id="copy-btn" type="button">Copy</button>
    </div>

    <section class="settings" aria-label="Password settings">
      <div class="length-row">
        <label>Password length</label>
        <output class="length-value" id="length-value">16</output>
      </div>

      <input
        class="length-slider"
        id="length"
        type="range"
        min="4"
        max="32"
      >

      <div class="options">
        <label class="option">
          <input id="uppercase" type="checkbox" checked>
          Uppercase (A–Z)
        </label>

        <label class="option">
          <input id="lowercase" type="checkbox" checked>
          Lowercase (a–z)
        </label>

        <label class="option">
          <input id="numbers" type="checkbox" checked>
          Numbers (0–9)
        </label>

        <label class="option">
          <input id="symbols" type="checkbox" checked>
          Symbols (!, @, #...)
        </label>
      </div>
    </section>

    <button class="generate-btn" id="generate-btn" type="button">Generate a password</button>
  </main>
  <script>
    const output = document.querySelector('#password')
    const copy = document.querySelector('#copy-btn')
    const lengthSlider = document.querySelector('#length')
    const lengthValue = document.querySelector('#length-value')
    const uppercase = document.querySelector('#uppercase')
    const lowercase = document.querySelector('#lowercase')
    const numbers = document.querySelector('#numbers')
    const symbols = document.querySelector('#symbols')
    const button = document.querySelector('#generate-btn')

    let length = 16

    const uppercaseChars = 'QWERTYUIOPASDFGHJKLZXCVBNM'
    const lowercaseChars = 'qwertyuiopasdfghjklzxcvbnm'
    const numbersChars = '1234567890'
    const symbolsChars = '!@#$%^&*()_+-=[]{}'

    lengthSlider.addEventListener('input', () => {
      length = lengthSlider.value
      lengthValue.textContent = length
    })

    function updateButtonState() {
      const noneChecked = !uppercase.checked && !lowercase.checked && !numbers.checked && !symbols.checked
      button.classList.toggle('blocked', noneChecked)
    }

    for (const checkbox of [uppercase, lowercase, numbers, symbols]) {
      checkbox.addEventListener('change', updateButtonState)
    }

    function updateCopyState() {
      copy.classList.toggle('blocked', !output.value)
    }
    updateCopyState()

    function generate() {
      let chars = ''
      let password = ''

      if (uppercase.checked) {
        chars += uppercaseChars
      }
      if (lowercase.checked) {
        chars += lowercaseChars
      }
      if (numbers.checked) {
        chars += numbersChars
      }
      if (symbols.checked) {
        chars += symbolsChars
      }

      for (let i = 1; i <= length; i ++) {
        const randomChar = chars[Math.floor(Math.random() * chars.length)]
        password += randomChar
      }

      output.value = password

      updateCopyState()
    }

    function copyPassword() {
      navigator.clipboard.writeText(output.value)
    }

    button.addEventListener('click', generate)
    copy.addEventListener('click', copyPassword)
  </script>
</body>
</html>
